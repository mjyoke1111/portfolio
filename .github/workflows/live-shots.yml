name: live-shots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          cat > s.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          for (const [n, o] of [['desktop', { viewport: { width: 1440, height: 900 } }], ['desktop-dark', { viewport: { width: 1440, height: 900 }, colorScheme: 'dark' }], ['mobile', { viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true }]]) {
            const c = await b.newContext(o); const p = await c.newPage();
            await p.goto('https://www.mjyoke1111.biz.id/', { waitUntil: 'networkidle' }); await p.waitForTimeout(1500);
            await p.screenshot({ path: `${n}.png` });
            await p.screenshot({ path: `${n}-full.png`, fullPage: true });
            await c.close();
          }
          await b.close();
          JS
          node s.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: live-shots
          path: '*.png'
          retention-days: 3
