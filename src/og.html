<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Onest"; src: url(../site/fonts/onest.woff2) format("woff2"); font-weight: 300 800; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  position: relative; background: #f7f7f4; color: #16202b; font-family: "Onest", sans-serif;
  background:
    radial-gradient(40% 60% at 10% 18%, rgba(150, 226, 198, .6), rgba(150, 226, 198, 0) 70%),
    radial-gradient(46% 64% at 92% 8%, rgba(160, 205, 245, .65), rgba(160, 205, 245, 0) 72%),
    radial-gradient(50% 56% at 66% 92%, rgba(204, 190, 246, .55), rgba(204, 190, 246, 0) 70%),
    #f7f7f4;
}
.l { position: absolute; left: 64px; top: 56px; bottom: 52px; width: 560px; display: flex; flex-direction: column; }
.who { display: flex; align-items: center; gap: 12px; font-weight: 650; font-size: 28px; letter-spacing: -.01em; }
.who svg { width: 36px; height: 36px; }
h1 { margin-top: 40px; font-weight: 620; font-size: 60px; line-height: 1.04; letter-spacing: -.035em; }
h1 span { color: #5b6676; }
.n { margin-top: auto; display: flex; background: #fff; border-radius: 22px; box-shadow: 0 1px 2px rgba(22,32,43,.05), 0 18px 40px -20px rgba(32,48,72,.25); overflow: hidden; }
.n div { flex: 1; padding: 16px 18px; }
.n div + div { border-left: 1px solid rgba(22,32,43,.09); }
.n b { display: block; font-weight: 600; font-size: 34px; letter-spacing: -.03em; line-height: 1.1; }
.n span { display: block; margin-top: 2px; font-size: 16px; color: #5b6676; }
.stack { position: absolute; right: 56px; top: 92px; width: 500px; height: 440px; }
.stack img { position: absolute; display: block; border-radius: 14px; box-shadow: 0 1px 2px rgba(22,32,43,.06), 0 24px 48px -20px rgba(32,48,72,.4); outline: 1px solid rgba(22,32,43,.09); aspect-ratio: 1.6; object-fit: cover; }
.a { width: 380px; right: 0; top: 0; }
.b { width: 300px; left: 0; top: 150px; }
.c { width: 230px; right: 20px; bottom: 0; }
</style>
</head>
<body>
<div class="l">
  <div class="who"><svg viewBox="0 0 28 28"><rect width="28" height="28" rx="8" fill="#16202b"/><circle cx="10" cy="11" r="6.5" fill="#7fd3b4"/><circle cx="18.5" cy="17" r="6.5" fill="#8cc3f0" opacity=".9"/></svg>mjyoke1111</div>
  <h1>I hand AI models real briefs and <span>publish what they make.</span></h1>
  <div class="n">
    <div><b>{{runs}}</b><span>model runs</span></div>
    <div><b>{{models}}</b><span>models</span></div>
    <div><b>{{games}}</b><span>games</span></div>
    <div><b>{{videos}}</b><span>videos</span></div>
  </div>
</div>
<div class="stack">
  <img class="a" src="../site/media/mr.webp" alt="">
  <img class="b" src="../site/media/game1.webp" alt="">
  <img class="c" src="../site/media/jev.webp" alt="">
</div>
</body>
</html>
